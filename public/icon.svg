<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Document Sheet -->
  <g transform="translate(116, 86)">
    <!-- Document shadow & base -->
    <rect x="0" y="0" width="280" height="340" rx="16" fill="#f8fafc" opacity="0.95"/>
    <path d="M 210 0 L 280 70 L 210 70 Z" fill="#cbd5e1"/>
    
    <!-- Document text placeholder lines -->
    <rect x="36" y="50" width="130" height="12" rx="6" fill="#94a3b8"/>
    <rect x="36" y="90" width="208" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="36" y="118" width="190" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="36" y="146" width="208" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="36" y="174" width="160" height="10" rx="5" fill="#cbd5e1"/>
    
    <!-- Scanned photo / graph box -->
    <rect x="36" y="210" width="208" height="85" rx="10" fill="#e2e8f0"/>
    <circle cx="70" cy="245" r="14" fill="#94a3b8"/>
    <path d="M 46 280 L 100 240 L 140 270 L 190 230 L 234 275 L 234 285 L 46 285 Z" fill="#cbd5e1"/>
  </g>

  <!-- Scan Target Reticle / Corner Brackets -->
  <g stroke="url(#primary)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- Top-Left -->
    <path d="M 80 160 L 80 110 A 30 30 0 0 1 110 80 L 160 80"/>
    <!-- Top-Right -->
    <path d="M 352 80 L 402 80 A 30 30 0 0 1 432 110 L 432 160"/>
    <!-- Bottom-Left -->
    <path d="M 80 352 L 80 402 A 30 30 0 0 0 110 432 L 160 432"/>
    <!-- Bottom-Right -->
    <path d="M 352 432 L 402 432 A 30 30 0 0 0 432 402 L 432 352"/>
  </g>

  <!-- Laser scanning beam -->
  <rect x="90" y="240" width="332" height="8" rx="4" fill="url(#laser)" filter="url(#glow)"/>
  <line x1="80" y1="244" x2="432" y2="244" stroke="#6ee7b7" stroke-width="3" opacity="0.85"/>
</svg>
