services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - scandoc_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks:
      - scandoc_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOMAIN=${DOMAIN}
      - MONGO_URI=${MONGO_URI:-mongodb://scandoc_user:scandoc_password@mongo:27017/scandoc?authSource=admin}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - UPLOAD_DIR=/data/uploads
      - MAX_USER_BYTES=${MAX_USER_BYTES:-1073741824}
    volumes:
      - scandoc_uploads:/data/uploads
      - scandoc_app_data:/data/db
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - scandoc_network

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-scandoc_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-scandoc_password}
      MONGO_INITDB_DATABASE: scandoc
    volumes:
      - mongo_data:/data/db
    # MongoDB port is explicitly NOT published to external host for security
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - scandoc_network

networks:
  scandoc_network:
    driver: bridge

volumes:
  mongo_data:
  scandoc_uploads:
  scandoc_app_data:
  caddy_data:
  caddy_config:
