# Cấu hình Nginx cho ScanDoc (chạy song song với web cũ)
# Thêm file này vào: /etc/nginx/sites-available/scandoc.click
# Hoặc copy vào mục "Nginx Conf" nếu dùng aaPanel / cPanel

server {
    listen 80;
    server_name scandoc.click www.scandoc.click;

    # Giới hạn kích thước tải lên (25MB cho ảnh scan tài liệu)
    client_max_body_size 25M;

    # Gzip nén dữ liệu
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
